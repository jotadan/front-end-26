<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Dinâmico de Temperatura</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        main {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 1.6rem;
        }

        .description {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .input-group {
            text-align: left;
            margin-bottom: 5px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: block;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 50px 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1.2rem;
            color: #0f172a;
            font-weight: 500;
            outline: none;
            transition: all 0.25s ease;
            background-color: #f8fafc;
        }

        input[type="number"]:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .unit-badge {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            font-weight: 600;
            color: #94a3b8;
            pointer-events: none;
        }

        .switch-icon {
            margin: 15px 0;
            display: inline-block;
            color: #3b82f6;
            background-color: #eff6ff;
            padding: 8px;
            border-radius: 50%;
            vertical-align: middle;
        }

        .switch-icon svg {
            display: block;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>

<body>

    <main>
        <h2>Conversor de Temperatura</h2>
        <p class="description">Digite o valor em qualquer um dos campos para converter em tempo real.</p>

        <div class="input-group">
            <label for="celsiusInput">Celsius (°C)</label>
            <div class="input-wrapper">
                <input type="number" id="celsiusInput" placeholder="0.00" step="0.01">
                <span class="unit-badge">°C</span>
            </div>
        </div>

        <div class="switch-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m17 11-4-4-4 4" />
                <path d="M13 7v14" />
                <path d="m7 13 4 4 4-4" />
                <path d="M11 17V3" />
            </svg>
        </div>

        <div class="input-group">
            <label for="fahrenheitInput">Fahrenheit (°F)</label>
            <div class="input-wrapper">
                <input type="number" id="fahrenheitInput" placeholder="32.00" step="0.01">
                <span class="unit-badge">°F</span>
            </div>
        </div>
    </main>

    <script>
        const campoC = document.getElementById('celsiusInput');
        const campoF = document.getElementById('fahrenheitInput');

        campoC.addEventListener('input', () => {
            if (campoC.value === "") {
                campoF.value = "";
                return;
            }

            const tempC = Number(campoC.value);
            let convF = (tempC * 9 / 5) + 32;

            campoF.value = convF.toFixed(2);
        });


        campoF.addEventListener('input', () => {
            if (campoF.value === "") {
                campoC.value = "";
                return;
            }

            const tempF = Number(campoF.value);
            let convC = (tempF - 32) * 5 / 9;

            campoC.value = convC.toFixed(2);
        });
    </script>
</body>

</html>
